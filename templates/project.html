{% extends 'base.html' %}
{% load static %}

{% block content %}
    <main>

        <section class="projects" style="padding-top: 3rem;">
            <div class="container">
                <h2>Projek Saya</h2>
                
                <div class="project-gallery">

                    {% for project in project_list %}
                        <a href="{% if project.project_link %}{{ project.project_link }}{% else %}#{% endif %}" class="project-item">
                            <img src="{% static project.image_url %}" alt="{{ project.title }}" class="project-img">
                            
                            <div class="project-overlay">
                                <h3>{{ project.title }}</h3>
                                <!-- DEKSRIPSI -->
                                <p style="color: var(--paper); font-size: 0.85rem; margin-bottom: 0.5rem; opacity: 0.9; padding: 0 1rem;">
                                    {{ project.description }}
                                </p>
                                <p class="project-tech">{{ project.tech_stack }}</p>
                                <span class="project-btn">Lihat Projek</span>
                            </div>
                        </a>
                    
                     <!-- JIKA KOSONG --> 
                    {% empty %}
                        <p style="color: var(--ink); text-align: center; grid-column: 1 / -1;">
                            Belum ada projek yang ditambahkan.
                        </p>
                    {% endfor %}
                </div>
            </div>
        </section>

    </main>
{% endblock content %}
