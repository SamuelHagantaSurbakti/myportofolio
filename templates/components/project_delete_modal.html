<p class="experience-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-project-{{ project.pk }}"
            aria-label="Hapus {{ project.title }}"
            title="Hapus proyek">
        Hapus
    </button>
</p>

<div id="delete-project-{{ project.pk }}"
     class="delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-project-title-{{ project.pk }}">
    <button type="button"
            class="delete-modal__backdrop"
            popovertarget="delete-project-{{ project.pk }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="delete-modal__content">
        <button type="button"
                class="delete-modal__close"
                popovertarget="delete-project-{{ project.pk }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-project-title-{{ project.pk }}">Hapus Projek?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ project.title }}</strong>?
        </p>
        <div class="delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-project-{{ project.pk }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_project' project.pk %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
